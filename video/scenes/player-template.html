<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>果蠅大腦玩 cute-dino · 影片播放器</title>
<meta name="description" content="七幕動畫的連續播放器：3 分 45 秒，字幕與畫面依時間軸同步。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ===== 播放器外殼 ===== */
:root {
  --play: running;
  --bg: #07090d;
  --panel: #12161d;
  --line: #232a33;
  --line-3: #2f3742;
  --ink: #f2f5f8;
  --muted: #a7b1bd;
  --dim: #7e8a97;
  --accent: #f0a93b;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --sans: "Noto Sans TC", "Microsoft JhengHei", system-ui, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; font-family: var(--sans); }
#app { position: fixed; left: 0; right: 0; top: 0; bottom: 96px; display: grid; place-items: center; }
body.bare #app { bottom: 0; }
#stage {
  position: relative; width: 1280px; height: 720px; background: #0d1016;
  transform: scale(var(--scale, 1)); transform-origin: center; overflow: hidden;
}
#stage * { animation-play-state: var(--play, running); }
.scene { position: absolute; inset: 0; display: none; }
.scene.on { display: block; }
#cap { position: absolute; left: 0; right: 0; bottom: 56px; display: flex; justify-content: center; z-index: 30; pointer-events: none; }
#capbox {
  max-width: 1080px; padding: 11px 24px; background: rgba(10,13,18,.86);
  border: 1px solid var(--line); border-radius: 6px;
  font-size: 27px; font-weight: 500; color: var(--ink); line-height: 1.5; text-align: center;
}
#cap.off, #capbox.empty { visibility: hidden; }
#fade { position: absolute; inset: 0; background: #0d1016; opacity: 0; pointer-events: none; z-index: 40; transition: opacity .2s linear; }
#fade.cut { opacity: 1; transition: none; }

/* ===== 控制列 ===== */
#bar {
  position: fixed; left: 0; right: 0; bottom: 0; height: 96px;
  display: flex; align-items: center; gap: 14px; padding: 0 20px;
  background: #0b0e13; border-top: 1px solid var(--line);
}
body.bare #bar { display: none; }
#bar button, #bar select {
  font-family: var(--mono); font-size: 12px; color: var(--muted);
  background: #1b212a; border: 1px solid var(--line-3); border-radius: 4px;
  padding: 0 12px; height: 36px; min-width: 44px; cursor: pointer;
}
#bar button:hover, #bar select:hover { color: var(--ink); border-color: #3c4653; }
#bar button.primary { background: var(--accent); border-color: var(--accent); color: #1a1205; font-weight: 600; width: 52px; }
#pp { font-size: 15px; }
.tc { font-family: var(--mono); font-size: 12px; color: var(--dim); min-width: 44px; text-align: center; }
#track { flex: 1; display: flex; flex-direction: column; gap: 6px; }
#seek { width: 100%; accent-color: var(--accent); height: 20px; }
#chips { display: flex; gap: 3px; }
#chips button {
  flex: none; height: 24px; padding: 0 9px; font-size: 10.5px; letter-spacing: .06em;
  background: var(--panel); border: 1px solid var(--line); color: var(--dim); min-width: 0;
}
#chips button.now { background: rgba(240,169,59,.18); border-color: var(--accent); color: var(--ink); }
.grp { display: flex; align-items: center; gap: 6px; }
.lbl { font-family: var(--mono); font-size: 10px; letter-spacing: .12em; color: #6f7b88; text-transform: uppercase; }
#hint {
  position: fixed; right: 16px; top: 14px; font-family: var(--mono); font-size: 11px; color: #46505c;
  pointer-events: none; z-index: 50;
}
body.bare #hint { display: none; }

/* ===== 各幕樣式（由 build 腳本插入） ===== */
/*SCENE_STYLES*/
</style>
</head>
<body>

<div id="app">
  <div id="stage">
/*SCENES*/
    <div id="cap"><div id="capbox" class="empty"></div></div>
    <div id="fade"></div>
  </div>
</div>

<div id="hint">空白鍵 播放／暫停 · ←→ 5 秒 · 1–7 跳幕 · H 隱藏介面 · F 全螢幕</div>

<div id="bar">
  <button id="pp" class="primary" aria-label="播放或暫停">▶</button>
  <span class="tc" id="tcNow">0:00</span>
  <div id="track">
    <input id="seek" type="range" min="0" max="225" step="0.02" value="0" aria-label="影片時間軸">
    <div id="chips"></div>
  </div>
  <span class="tc" id="tcAll">3:45</span>
  <div class="grp">
    <span class="lbl">速度</span>
    <select id="rate" aria-label="播放速度">
      <option value="0.25">0.25×</option>
      <option value="0.5">0.5×</option>
      <option value="1" selected>1×</option>
      <option value="1.5">1.5×</option>
      <option value="2">2×</option>
    </select>
  </div>
  <button id="cc" aria-label="切換字幕">字幕 開</button>
  <button id="hide" aria-label="隱藏介面">隱藏介面</button>
  <button id="fs" aria-label="全螢幕">全螢幕</button>
</div>

<script>
(function () {
  "use strict";

  // 每一幕在成片中的起點與長度（秒）。改動時請同步 SCENE_DUR 的動畫總長。
  var SCENES = [
    { id: "sc1", name: "01 鉤子",     start: 0,   dur: 14 },
    { id: "sc2", name: "02 連接體",   start: 14,  dur: 34 },
    { id: "sc3", name: "03 資料流",   start: 48,  dur: 47 },
    { id: "sc4", name: "04 269 參數", start: 95,  dur: 35 },
    { id: "sc5", name: "05 消融",     start: 130, dur: 40 },
    { id: "sc6", name: "06 但書",     start: 170, dur: 35 },
    { id: "sc7", name: "07 收尾",     start: 205, dur: 20 }
  ];
  var TOTAL = 225;

  // 字幕：[起, 訖, 文字]，秒。與旁白同進同出。
  var CUES = [
    [0.8, 7.0, "這不是遊戲 AI。這是一段真實的果蠅神經迴路，正在玩一款跑酷遊戲。"],
    [7.4, 13.6, "80 顆神經元、1,296 條實際量測到的突觸連接。"],

    [14.6, 21.0, "這些細胞來自 MaleCNS v1.0，雄果蠅全腦的電子顯微鏡連接體。"],
    [21.4, 27.5, "牠們之間怎麼接，不是我設計的，是掃出來的。"],
    [28.0, 35.0, "1,296 條連線、26,029 個突觸接觸。"],
    [35.5, 42.5, "整段電路的權重從頭到尾固定，一個都不訓練。"],
    [43.0, 47.6, "我只是把它接上遊戲。"],

    [48.6, 55.0, "每秒三十次，遊戲畫面被壓成 13 個數字。"],
    [55.5, 63.0, "最近的障礙物還有多久撞上、它的底端離地多高。"],
    [63.5, 70.0, "玩家在不在地上、子彈的高度差。"],
    [70.5, 78.0, "這 13 個通道注入 32 顆視覺投射神經元。"],
    [78.5, 86.0, "沿著那 1,296 條實測接線同步傳播三輪。"],
    [86.5, 94.6, "最後匯聚到 16 顆下行神經元 —— 真實果蠅裡，下令起跳的就是這批細胞。"],

    [95.6, 103.0, "全系統唯一會學習的東西，是末端這個讀出網路。"],
    [103.5, 110.5, "16 進、12 個隱藏單元、5 個動作出，總共 269 個參數。"],
    [111.0, 118.5, "用交叉熵方法演化 400 代，每代 64 個候選、留最好的 8 個。"],
    [119.0, 129.6, "它決定的只有一件事：現在要跑、跳、蹲，還是左右移。"],

    [130.6, 136.5, "那段電路真的有在做事嗎？"],
    [137.0, 144.5, "消融實驗：把 16 顆下行神經元的輸出強制歸零，其他一切不動。"],
    [145.0, 152.5, "100 條沒看過的賽道，完整版平均活 161 秒。"],
    [153.0, 159.0, "電路一靜默 —— 3.5 秒。"],
    [159.5, 165.0, "那是這個環境的地板，跟完全不按鍵一模一樣。"],
    [165.5, 169.6, "三個訓練種子重跑，消融比 41.6 ± 7.4 倍。"],

    [170.6, 176.0, "兩件必須講清楚的事。"],
    [176.5, 183.5, "第一，換一個訓練種子，成績會在 46 到 87 之間跳。"],
    [184.0, 191.0, "82/100 是這個模型的成績，不是這個方法的成績。"],
    [191.5, 198.5, "第二，跟完全不用神經網路的手寫規則比，它只好 1.77 倍。"],
    [199.0, 204.6, "消融證明的是這段電路有貢獻，不是這個 agent 已經是最強解。"],

    [205.6, 212.0, "畫面是即時運算，不是預錄動畫。"],
    [212.5, 219.0, "每 1/30 秒，遊戲狀態都真的流過那 1,296 條接線一次。"],
    [219.5, 224.6, "程式、資料、完整實驗協定都開源。"]
  ];

  var stage = document.getElementById("stage");
  var fade = document.getElementById("fade");
  var cap = document.getElementById("cap");
  var capbox = document.getElementById("capbox");
  var seek = document.getElementById("seek");
  var tcNow = document.getElementById("tcNow");
  var ppBtn = document.getElementById("pp");
  var chips = document.getElementById("chips");
  var rateSel = document.getElementById("rate");

  var els = SCENES.map(function (s) { return document.getElementById(s.id); });
  var t = 0, playing = false, rate = 1, cur = -1, lastNow = 0, lastCap = null, dragging = false;

  SCENES.forEach(function (s, i) {
    var b = document.createElement("button");
    b.type = "button";
    b.textContent = s.name;
    b.addEventListener("click", function () { jump(s.start + 0.01); });
    chips.appendChild(b);
  });
  var chipBtns = Array.prototype.slice.call(chips.children);

  function fmt(x) {
    var m = Math.floor(x / 60), s = Math.floor(x % 60);
    return m + ":" + (s < 10 ? "0" : "") + s;
  }

  function sceneAt(time) {
    for (var i = SCENES.length - 1; i >= 0; i--) { if (time >= SCENES[i].start) return i; }
    return 0;
  }

  function applyRate() {
    var list = document.getAnimations ? document.getAnimations() : [];
    for (var i = 0; i < list.length; i++) {
      try { list[i].playbackRate = rate; } catch (e) { /* 部分動畫不可調速，略過 */ }
    }
  }

  // 切幕：display 切換會讓該幕的 CSS 動畫重新開始，再用 --seek 把它推到正確的進度。
  function mount(i, time, hardCut) {
    if (hardCut) { fade.classList.add("cut"); }
    for (var k = 0; k < els.length; k++) { els[k].classList.toggle("on", k === i); }
    var into = time - SCENES[i].start;
    els[i].style.setProperty("--seek", (-into).toFixed(3) + "s");
    cur = i;
    requestAnimationFrame(function () {
      applyRate();
      if (hardCut) { fade.classList.remove("cut"); }
    });
  }

  function jump(time) {
    t = Math.max(0, Math.min(TOTAL, time));
    mount(sceneAt(t), t, true);
    paint();
  }

  function paint() {
    if (!dragging) { seek.value = t; }
    tcNow.textContent = fmt(t);
    var txt = "";
    for (var i = 0; i < CUES.length; i++) {
      if (t >= CUES[i][0] && t < CUES[i][1]) { txt = CUES[i][2]; break; }
    }
    if (txt !== lastCap) {
      capbox.textContent = txt;
      capbox.classList.toggle("empty", !txt);
      lastCap = txt;
    }
    for (var j = 0; j < chipBtns.length; j++) { chipBtns[j].classList.toggle("now", j === cur); }
  }

  function loop(now) {
    if (playing) {
      if (lastNow) { t += (now - lastNow) / 1000 * rate; }
      if (t >= TOTAL) { t = TOTAL; setPlaying(false); }
      var i = sceneAt(t);
      if (i !== cur) { mount(i, t, true); }
      paint();
    }
    lastNow = now;
    requestAnimationFrame(loop);
  }

  function setPlaying(on) {
    playing = on;
    lastNow = 0;
    document.documentElement.style.setProperty("--play", on ? "running" : "paused");
    ppBtn.textContent = on ? "❚❚" : "▶";
    if (on && t >= TOTAL) { jump(0); }
  }

  ppBtn.addEventListener("click", function () { setPlaying(!playing); });
  seek.addEventListener("input", function () { dragging = true; jump(parseFloat(seek.value)); });
  seek.addEventListener("change", function () { dragging = false; });
  rateSel.addEventListener("change", function () { rate = parseFloat(rateSel.value); applyRate(); });
  document.getElementById("cc").addEventListener("click", function (e) {
    cap.classList.toggle("off");
    e.currentTarget.textContent = cap.classList.contains("off") ? "字幕 關" : "字幕 開";
  });
  document.getElementById("hide").addEventListener("click", function () { document.body.classList.add("bare"); fit(); });
  document.getElementById("fs").addEventListener("click", function () {
    if (document.fullscreenElement) { document.exitFullscreen(); } else { document.documentElement.requestFullscreen(); }
  });

  document.addEventListener("keydown", function (e) {
    if (e.target && /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) { return; }
    var k = e.key;
    if (k === " ") { e.preventDefault(); setPlaying(!playing); }
    else if (k === "ArrowRight") { e.preventDefault(); jump(t + 5); }
    else if (k === "ArrowLeft") { e.preventDefault(); jump(t - 5); }
    else if (k === "Home") { jump(0); }
    else if (k >= "1" && k <= "7") { jump(SCENES[parseInt(k, 10) - 1].start + 0.01); }
    else if (k === "h" || k === "H") { document.body.classList.toggle("bare"); fit(); }
    else if (k === "c" || k === "C") { document.getElementById("cc").click(); }
    else if (k === "f" || k === "F") { document.getElementById("fs").click(); }
  });

  function fit() {
    var bare = document.body.classList.contains("bare");
    var h = window.innerHeight - (bare ? 0 : 96);
    stage.style.setProperty("--scale", Math.min(window.innerWidth / 1280, h / 720));
  }
  window.addEventListener("resize", fit);

  fit();
  jump(0);
  setPlaying(false);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
